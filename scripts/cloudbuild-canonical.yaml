steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --rm --network none --read-only --pids-limit 128 --memory 2g --cpus 1 \
          --cap-drop ALL --cap-add SETUID --cap-add SETGID --cap-add KILL --cap-add CHOWN \
          --cap-add DAC_OVERRIDE --cap-add SYS_PTRACE --security-opt no-new-privileges \
          --mount type=volume,destination=/tmp --tmpfs /dev/shm:ro,size=16m \
          -v /workspace:/workspace -w /workspace '${_SANDBOX_IMAGE}' \
          python3 scripts/canonical_check.py --image '${_SANDBOX_IMAGE}'
substitutions:
  _SANDBOX_IMAGE: us-central1-docker.pkg.dev/openevalz-sbx-84737/openevalz/eval-scicode-sandbox:1.0.0
timeout: 21600s

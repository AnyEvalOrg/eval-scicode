[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-scicode"
version = "1.1.0"
description = "SciCode and SciCode-Verified sequential scientific code generation for AnyEval and Inspect"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
# AnyEval requirements give ranges; these are its installed, resolved versions.
inspect = ["inspect_ai==0.3.260"]
anyeval = ["inspect_ai==0.3.260", "inspect-evals==0.19.0", "inspect-k8s-sandbox==0.13.0"]
test = ["inspect_ai==0.3.260", "inspect-k8s-sandbox==0.13.0", "pytest>=8", "PyYAML>=6", "jsonschema>=4", "numpy==1.26.4", "scipy==1.13.1", "sympy==1.13.3", "h5py==3.11.0"]

# Inspect discovers this import before resolving the scicode task.
[project.entry-points.inspect_ai]
scicode = "scicode"

[tool.setuptools]
packages = ["scicode"]
include-package-data = true
license-files = ["LICENSE", "NOTICE.md"]

[tool.setuptools.package-data]
scicode = ["data/*.gz", "data/*.json", "*.yaml", "*.txt", "Dockerfile", "*.Dockerfile", "chart/*.yaml", "chart/templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --basetemp=.build/pytest-tmp"
